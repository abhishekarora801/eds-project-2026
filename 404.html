<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main.error .section {
      max-width: 640px;
      padding: 32px 16px;
    }

    main.error .error-number {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    main.error .error-number text {
      font-family: var(--body-font-family), monospace;
      font-weight: 800;
      fill: var(--link-color);
    }

    main.error .error-message {
      margin: 8px 0 12px;
      font-size: 2rem;
    }

    main.error .error-lede {
      color: var(--text-color);
      margin: 0 auto 24px;
      max-width: 40ch;
    }

    main.error .error-links {
      list-style: none;
      padding: 0;
      margin: 24px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
    }

    main.error .error-links a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 600;
    }

    main.error .error-links a:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="0 0 38 18" class="error-number" aria-hidden="true">
        <text x="0" y="17">404</text>
      </svg>
      <h2 class="error-message">This page wandered off.</h2>
      <p class="error-lede">The link you followed may be broken, or the page may have moved. Try one of these instead.</p>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go home</a>
      </p>
      <ul class="error-links">
        <li><a href="/about">About</a></li>
        <li><a href="/blog">Blog</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="/terms-and-conditions">Terms &amp; Conditions</a></li>
      </ul>
    </div>
  </main>
  <footer></footer>
</body>

</html>
